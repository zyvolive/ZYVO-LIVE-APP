name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Setup Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ZYVO_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring app/google-services.json from repository secret ZYVO_GOOGLE_SERVICES_JSON..."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Secret ZYVO_GOOGLE_SERVICES_JSON is not set or empty. Checking for existing app/google-services.json..."
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing! Please add the ZYVO_GOOGLE_SERVICES_JSON secret in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "app/google-services.json successfully verified."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyvo-live-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
